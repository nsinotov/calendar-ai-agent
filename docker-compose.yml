services:
  agent:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - agent-data:/app/data
    expose:
      - "${PORT:-3000}"

  # TLS proxy for the Telegram webhook: `docker compose --profile webhook up -d --build`.
  # Without the profile (long polling) only the agent runs.
  caddy:
    image: caddy:2
    profiles: [webhook]
    restart: unless-stopped
    depends_on:
      - agent
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-${DOMAIN}}
      PORT: ${PORT:-3000}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:?Set PRIVACY_CONTACT_EMAIL in .env}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site/index.html:/srv/index.html:ro
      - ./site/privacy.html:/srv/privacy.html:ro
      - ./PRIVACY.md:/srv/PRIVACY.md:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  agent-data:
  caddy-data:
  caddy-config:
