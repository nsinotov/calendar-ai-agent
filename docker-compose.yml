services:
  agent:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - agent-data:/app/data
    expose:
      - "${PORT:-3000}"

  # TLS proxy for the Telegram webhook: `docker compose --profile webhook up -d --build`.
  # Without the profile (long polling) only the agent runs.
  caddy:
    image: caddy:2
    profiles: [webhook]
    restart: unless-stopped
    depends_on:
      - agent
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      PORT: ${PORT:-3000}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  agent-data:
  caddy-data:
  caddy-config:
