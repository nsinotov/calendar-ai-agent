<!doctype html>
<!-- Plays transcript.json as a Telegram-style chat on an iPhone. record.ts sets window.TRANSCRIPT and calls
     demo.render(ms) frame by frame, so the animation is a pure function of time. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Calendar AI Agent demo</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #e9edf2;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .phone {
        position: relative;
        width: 414px;
        height: 868px;
        padding: 12px;
        border-radius: 64px;
        background: #1c1c1e;
        box-shadow:
          0 0 0 2px #3a3a3c,
          0 24px 48px rgba(0, 0, 0, 0.25);
      }
      .screen {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 390px;
        height: 844px;
        overflow: hidden;
        border-radius: 52px;
        background: linear-gradient(160deg, #d6e4c4 0%, #b9d3a8 50%, #a9c7a0 100%);
      }
      .island {
        position: absolute;
        top: 11px;
        left: 50%;
        z-index: 3;
        width: 124px;
        height: 36px;
        border-radius: 18px;
        background: #000;
        transform: translateX(-50%);
      }
      .top {
        position: relative;
        z-index: 2;
        background: rgba(247, 247, 247, 0.94);
        border-bottom: 0.5px solid rgba(0, 0, 0, 0.2);
      }
      .status-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 54px;
        padding: 6px 30px 0 46px;
        font-size: 17px;
        font-weight: 600;
      }
      .status-icons {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .nav {
        display: flex;
        align-items: center;
        height: 52px;
        padding: 0 12px 6px 8px;
      }
      .back {
        display: flex;
        align-items: center;
        gap: 2px;
        width: 92px;
        color: #007aff;
        font-size: 17px;
      }
      .title {
        flex: 1;
        text-align: center;
        line-height: 1.2;
      }
      .title b {
        display: block;
        font-size: 17px;
        font-weight: 600;
      }
      .title span {
        color: #8e8e93;
        font-size: 13px;
      }
      .title span.typing {
        color: #007aff;
      }
      .avatar-wrap {
        display: flex;
        justify-content: flex-end;
        width: 92px;
      }
      .avatar {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: linear-gradient(180deg, #72d5fd, #2a9ef1);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
      }
      .chat {
        position: relative;
        flex: 1;
        overflow: hidden;
      }
      .messages {
        position: absolute;
        right: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px 10px 12px;
      }
      .day {
        align-self: center;
        margin-bottom: 4px;
        padding: 3px 9px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.18);
        color: #fff;
        font-size: 13px;
        font-weight: 500;
      }
      .bubble {
        position: relative;
        max-width: 82%;
        padding: 6px 10px 7px 11px;
        border-radius: 17px;
        font-size: 16px;
        line-height: 21px;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
      }
      .bubble.bot {
        align-self: flex-start;
        border-bottom-left-radius: 6px;
        background: #fff;
      }
      .bubble.user {
        align-self: flex-end;
        border-bottom-right-radius: 6px;
        background: #e1fec6;
      }
      .meta {
        float: right;
        position: relative;
        top: 7px;
        margin-left: 10px;
        color: #8e8e93;
        font-size: 11px;
        line-height: 14px;
      }
      .bubble.user .meta {
        color: #3ea140;
      }
      .composer {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        padding: 7px 10px 40px;
        background: rgba(247, 247, 247, 0.96);
        border-top: 0.5px solid rgba(0, 0, 0, 0.2);
      }
      .field {
        flex: 1;
        min-height: 36px;
        padding: 7px 14px;
        border: 0.5px solid #d1d1d6;
        border-radius: 18px;
        background: #fff;
        font-size: 17px;
        line-height: 21px;
      }
      .field.empty {
        color: #c4c4c7;
      }
      .caret {
        display: inline-block;
        width: 2px;
        height: 20px;
        margin-left: 1px;
        vertical-align: -4px;
        background: #007aff;
      }
      .icon {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 36px;
      }
      .send {
        width: 32px;
        height: 32px;
        margin-bottom: 2px;
        border-radius: 50%;
        background: #007aff;
      }
      .home {
        position: absolute;
        bottom: 9px;
        left: 50%;
        width: 140px;
        height: 5px;
        border-radius: 3px;
        background: #000;
        transform: translateX(-50%);
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="screen">
        <div class="island"></div>
        <div class="top">
          <div class="status-bar">
            <span id="clock">9:41</span>
            <span class="status-icons">
              <svg width="18" height="12" viewBox="0 0 18 12">
                <rect x="0" y="8" width="3" height="4" rx="1" />
                <rect x="5" y="5.5" width="3" height="6.5" rx="1" />
                <rect x="10" y="3" width="3" height="9" rx="1" />
                <rect x="15" y="0" width="3" height="12" rx="1" />
              </svg>
              <svg width="16" height="12" viewBox="0 0 16 12">
                <path
                  d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4 10.4 10.4 0 0 0 .8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4Z"
                />
                <path
                  d="M8 5.6c1.4 0 2.6.5 3.6 1.4l1.2-1.3A7 7 0 0 0 8 3.8a7 7 0 0 0-4.8 1.9L4.4 7A5.2 5.2 0 0 1 8 5.6Z"
                />
                <path d="M8 9c.6 0 1.1.2 1.5.6L8 11.2 6.5 9.6C6.9 9.2 7.4 9 8 9Z" />
              </svg>
              <svg width="27" height="13" viewBox="0 0 27 13">
                <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#000" opacity="0.4" />
                <rect x="2" y="2" width="20" height="9" rx="2" />
                <path d="M25 4.5v4a2 2 0 0 0 0-4Z" opacity="0.4" />
              </svg>
            </span>
          </div>
          <div class="nav">
            <div class="back">
              <svg width="12" height="20" viewBox="0 0 12 20">
                <path
                  d="M10 2 2 10l8 8"
                  fill="none"
                  stroke="#007aff"
                  stroke-width="2.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              Chats
            </div>
            <div class="title">
              <b>Calendar Assistant</b>
              <span id="status">bot</span>
            </div>
            <div class="avatar-wrap"><div class="avatar">CA</div></div>
          </div>
        </div>
        <div class="chat"><div class="messages" id="messages"></div></div>
        <div class="composer">
          <div class="icon">
            <svg
              width="26"
              height="26"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#8e8e93"
              stroke-width="1.8"
              stroke-linecap="round"
            >
              <path
                d="M20 11.5 12.2 19.3a5 5 0 0 1-7.1-7.1l8.2-8.2a3.3 3.3 0 0 1 4.7 4.7l-8.2 8.2a1.7 1.7 0 0 1-2.4-2.4l7.5-7.5"
              />
            </svg>
          </div>
          <div class="field" id="field"></div>
          <div class="icon" id="action"></div>
        </div>
        <div class="home"></div>
      </div>
    </div>
    <script>
      // Timing, in milliseconds.
      const START_DELAY = 900;
      const THINK = 700;
      const TYPE_PER_CHAR = 45;
      const TYPE_MAX = 2200;
      const BOT_TYPING = 1400;
      const READ_PER_CHAR = 32;
      const READ_MIN = 2400;
      const READ_MAX = 9000;
      const APPEAR = 220;
      const END_HOLD = 2500;

      const MIC =
        '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>';
      const SEND =
        '<div class="send" style="display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 14V2M3 7l5-5 5 5"/></svg></div>';
      const CHECKS =
        '<svg width="16" height="10" viewBox="0 0 16 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-left:3px"><path d="m1 5.5 3 3L10 1.5M7 8.5l7-7"/></svg>';

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
      const ease = (p) => (p < 0.5 ? 2 * p * p : 1 - (-2 * p + 2) ** 2 / 2);
      const escapeHtml = (text) => text.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

      const { timezone, messages } = window.TRANSCRIPT;
      const timeOf = (iso) =>
        new Date(iso).toLocaleTimeString("en-GB", { timeZone: timezone, hour: "2-digit", minute: "2-digit" });
      const dayOf = (iso) =>
        new Date(iso).toLocaleDateString("en-US", { timeZone: timezone, month: "long", day: "numeric" });

      // When each message is typed, shown and read.
      let t = START_DELAY;
      const timeline = messages.map((message, index) => {
        const text = message.text.replace(/[ \t]+$/gm, "");
        const entry = { ...message, text, index };
        if (message.from === "user") {
          entry.typeStart = t + THINK;
          entry.shownAt = entry.typeStart + Math.min(TYPE_MAX, text.length * TYPE_PER_CHAR);
        } else {
          const followsUser = messages[index - 1]?.from === "user";
          entry.typingFrom = followsUser ? t + 300 : null;
          entry.shownAt = followsUser ? t + 300 + BOT_TYPING : t;
        }
        entry.readUntil =
          message.from === "user"
            ? entry.shownAt
            : entry.shownAt + clamp(text.length * READ_PER_CHAR, READ_MIN, READ_MAX);
        t = entry.readUntil;

        return entry;
      });
      const duration = t + END_HOLD;

      const list = document.getElementById("messages");
      list.innerHTML =
        `<div class="day">${dayOf(messages[0].at)}</div>` +
        timeline
          .map(
            (m) =>
              `<div class="bubble ${m.from}">${escapeHtml(m.text)}<span class="meta">${timeOf(m.at)}${
                m.from === "user" ? CHECKS : ""
              }</span></div>`,
          )
          .join("");
      const bubbles = [...list.querySelectorAll(".bubble")];
      const chat = document.querySelector(".chat");

      function render(now) {
        const shown = timeline.filter((m) => m.shownAt <= now);
        bubbles.forEach((bubble, i) => {
          const m = timeline[i];
          const visible = m.shownAt <= now;
          bubble.style.display = visible ? "" : "none";
          const p = visible ? clamp((now - m.shownAt) / APPEAR, 0, 1) : 0;
          bubble.style.opacity = String(p);
          bubble.style.transform = `translateY(${(1 - p) * 12}px)`;
        });

        // Show the newest message from its top, then scroll down through it while it's being read.
        const bottom = Math.max(0, list.offsetHeight - chat.clientHeight);
        let scroll = bottom;
        const newest = shown.at(-1);
        if (newest) {
          const bubble = bubbles[newest.index];
          const top = clamp(bubble.offsetTop - 10, 0, bottom);
          const reading = newest.readUntil - newest.shownAt;
          const p = clamp((now - newest.shownAt - reading * 0.3) / (reading * 0.5), 0, 1);
          scroll = top + (bottom - top) * ease(p);
        }
        list.style.top = `${-scroll}px`;

        const typing = timeline.find((m) => m.from === "user" && m.typeStart <= now && now < m.shownAt);
        const field = document.getElementById("field");
        if (typing) {
          const chars = Math.ceil(
            ((now - typing.typeStart) / (typing.shownAt - typing.typeStart)) * typing.text.length,
          );
          field.className = "field";
          field.innerHTML = `${escapeHtml(typing.text.slice(0, chars))}<span class="caret"></span>`;
        } else {
          field.className = "field empty";
          field.textContent = "Message";
        }
        document.getElementById("action").innerHTML = typing ? SEND : MIC;

        const botTyping = timeline.some((m) => m.typingFrom !== null && m.typingFrom <= now && now < m.shownAt);
        const status = document.getElementById("status");
        status.className = botTyping ? "typing" : "";
        status.textContent = botTyping ? "typing…" : "bot";

        const latest = shown.at(-1) ?? timeline[0];
        document.getElementById("clock").textContent = timeOf(latest.at).replace(/^0/, "");
      }

      window.demo = { duration, render };
      render(0);
    </script>
  </body>
</html>
